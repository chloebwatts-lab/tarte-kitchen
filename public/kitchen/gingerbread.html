<style>
/* One page = one picture, like a brick-set booklet: parts box top-left, tools bottom-left, caption at the bottom. */
:root {
  --paper: #f4f5f2; --card: #ffffff; --ink: #1d2935; --muted: #5b6774; --rule: #d9dee1; --accent: #d9731f; --accent-ink: #ffffff;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #10151b; --card: #ffffff; --ink: #1d2935; --muted: #5b6774; --rule: #29323c; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #10151b; --card: #ffffff; --ink: #1d2935; --muted: #5b6774; --rule: #29323c; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); font: 16px/1.4 var(--body); color: var(--ink); }
.wrap { max-width: 1500px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
.sheet { position: relative; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 2; width: 100%; }
body.print .wrap { max-width: none; padding: 0; }
body.print .sheet { width: 1500px; height: 1000px; aspect-ratio: auto; border: 0; border-radius: 0; }
body.print .nav { display: none; }
canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.num { position: absolute; left: 2.2%; top: 3%; width: 7.2%; aspect-ratio: 1; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 clamp(14px, 3.4vw, 46px)/1 var(--body); }
body.print .num { font-size: 50px; }
.badge { position: absolute; right: 3%; top: 4%; background: var(--ink); color: #fff; border-radius: 10px; padding: 0.4em 0.8em; font: 700 clamp(14px, 2.6vw, 34px)/1 var(--mono); }
body.print .badge { font-size: 38px; }
.parts { position: absolute; left: 2.2%; top: 14%; width: 22%; max-height: 54%; overflow: auto; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 2% 1.4%; display: grid; gap: 0.5em; }
.parts div { display: grid; grid-template-columns: 44% 1fr; align-items: center; gap: 4%; }
.parts img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; }
.parts b { font: 700 clamp(11px, 1.6vw, 24px)/1.1 var(--mono); }
.parts small { display: block; font: 500 clamp(9px, 1.05vw, 15px)/1.15 var(--body); color: var(--muted); margin-top: 0.2em; }
body.print .parts b { font-size: 24px; } body.print .parts small { font-size: 15px; }
/* cover page: the whole inventory in two columns */
.sheet.inv .parts { width: 31%; max-height: 74%; grid-template-columns: 1fr 1fr; gap: 0.25em 0.8em; }
.sheet.inv .parts div { grid-template-columns: 36% 1fr; }
.sheet.inv .parts b { font-size: clamp(10px, 1.15vw, 17px); } .sheet.inv .parts small { font-size: clamp(8px, 0.85vw, 12px); }
body.print .sheet.inv .parts b { font-size: 17px; } body.print .sheet.inv .parts small { font-size: 12px; }
.tools { position: absolute; left: 2.2%; bottom: 13%; display: flex; flex-wrap: wrap; gap: 0.6em; max-width: 30%; }
.tools span { display: inline-flex; align-items: center; gap: 0.4em; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0.3em 0.8em 0.3em 0.5em; font: 600 clamp(10px, 1.25vw, 18px)/1 var(--body); }
.tools svg { width: 1.7em; height: 1.7em; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
body.print .tools span { font-size: 18px; }
.cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.2% 2.4% 1.6%; background: linear-gradient(to top, #fff 70%, rgba(255,255,255,0)); }
.cap h2 { margin: 0 0 0.15em; font: 700 clamp(15px, 2.4vw, 34px)/1.1 var(--body); }
.cap p { margin: 0; font: 400 clamp(11px, 1.45vw, 21px)/1.3 var(--body); color: var(--ink); max-width: 70ch; }
body.print .cap h2 { font-size: 38px; } body.print .cap p { font-size: 24px; }
.legend { position: absolute; right: 2.2%; top: 14%; width: 24%; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 1.4%; display: grid; gap: 0.45em; font: 600 clamp(10px, 1.2vw, 17px)/1.2 var(--body); }
.legend span { display: flex; align-items: center; gap: 0.5em; }
.legend svg { width: 1.8em; height: 1.8em; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.legend h3 { margin: 0 0 0.2em; font: 700 clamp(11px, 1.4vw, 20px)/1.1 var(--mono); }
body.print .legend { font-size: 17px; } body.print .legend h3 { font-size: 20px; }
.nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 12px; }
.nav button { font: 600 1rem var(--body); padding: 12px 18px; border-radius: 10px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; }
.nav button.next { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); justify-self: end; }
.nav button.back { justify-self: start; }
.nav button:disabled { opacity: 0.4; cursor: default; }
.nav span { font: 500 0.85rem var(--mono); color: var(--muted); }
.play { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
.play button { font: 600 0.95rem var(--body); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; }
.play button::before { content: ""; display: inline-block; width: 0; height: 0; border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-right: 8px; vertical-align: -1px; }
.play button#watchall.on::before { border: 0; width: 9px; height: 12px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
.play button:disabled { opacity: 0.4; cursor: default; }
.play label { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; font: 500 0.8rem var(--mono); color: var(--muted); }
.play input[type=range] { flex: 1; accent-color: var(--accent); min-width: 120px; }
body.print .play { display: none; }
@media (max-width: 700px) {
  .sheet { aspect-ratio: 3 / 4; }
  .parts { width: 34%; max-height: 40%; }
  .tools { max-width: 60%; bottom: 17%; }
  .legend { width: 44%; }
}

/* tap a tool for how (added by guide_finish.py, same as guide_now.py): the tools sit in their own row under the picture */
.toolrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; }
.toolrow > span { font: 500 0.85rem var(--mono); color: var(--muted); }
.toolrow:has(#tools:empty) { display: none; }
.toolrow .tools { position: static; max-width: none; display: flex; flex-wrap: wrap; gap: 8px; }
.toolrow .tools button.tl { font-size: 15px; padding: 7px 8px 7px 10px; min-height: 44px; }
body.print .toolrow { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toolrow > span { color: #aab4be; } }
:root[data-theme="dark"] .toolrow > span { color: #aab4be; }
.tools button.tl { display: inline-flex; align-items: center; gap: 0.4em; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0.3em 0.4em 0.3em 0.5em; font: 600 clamp(10px, 1.25vw, 18px)/1 var(--body); color: var(--ink); cursor: pointer; }
.tools button.tl:hover, .tools button.tl:focus-visible { background: #fff4ea; outline: none; box-shadow: 0 0 0 3px rgba(217, 115, 31, 0.35); }
.tl i { font-style: normal; display: inline-grid; place-items: center; width: 1.35em; height: 1.35em; border-radius: 50%; background: var(--accent); color: #fff; font: 700 0.85em/1 var(--body); }
.legend button.tl { display: flex; align-items: center; gap: 0.5em; width: 100%; background: none; border: 0; padding: 0.1em 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.legend button.tl i { margin-left: auto; }
body.print .tools button.tl { font-size: 18px; } body.print .tl i { display: none; }
.how { position: fixed; inset: 0; z-index: 50; background: rgba(16, 21, 27, 0.55); display: grid; place-items: center; padding: 16px; }
.howcard { background: #fff; color: var(--ink); border-radius: 14px; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; padding: 14px 18px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); }
.howhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: -14px; background: #fff; padding: 4px 0 8px; z-index: 1; }
.howhead h2 { margin: 0; display: flex; align-items: center; gap: 10px; font: 700 1.2rem/1.15 var(--body); min-width: 0; }
.howhead svg { width: 30px; height: 30px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#howClose { font: 600 0.95rem var(--body); padding: 10px 16px; min-height: 44px; border-radius: 999px; border: 1px solid #d9dee1; background: #fff; color: var(--ink); cursor: pointer; flex: none; }
#howBody h3 { margin: 14px 0 6px; font: 600 0.72rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
#howBody svg.pic { width: 100%; height: auto; display: block; background: #f7f3ea; border-radius: 10px; }
#howBody svg.pic text { font: 600 12px var(--body); fill: var(--ink); }
#howBody ol { margin: 10px 0 0; padding-left: 1.4em; font: 400 1rem/1.45 var(--body); }
#howBody li { margin: 0.25em 0; }
#howBody p.key { margin: 8px 0 0; font: 500 0.95rem/1.4 var(--body); }
/* check before you glue: a drawing with numbered callouts, right under the picture */
.check { margin-top: 12px; background: #fff; color: var(--ink); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px 14px; }
.check h3 { margin: 0 0 10px; font: 700 1.1rem/1.2 var(--body); color: var(--ink); text-wrap: balance; }
.checkgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: center; }
.checkpic svg { width: 100%; height: auto; display: block; background: #f7f3ea; border-radius: 10px; }
.checkpic svg text { font-family: var(--body); font-weight: 600; fill: #1d2935; }
.check ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font: 400 1.02rem/1.4 var(--body); }
.check li { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 10px; align-items: start; }
.check li b { display: inline-grid; place-items: center; width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--accent); color: #fff; font: 700 1rem/1 var(--body); }
@media (max-width: 700px) { .checkgrid { grid-template-columns: 1fr; } }
body.print .check { display: none; }
.cap { position: static; background: none; padding: 6px 2px 12px; }
.cap h2 { font: 700 clamp(26px, 3.6vw, 42px)/1.1 var(--body); margin: 0 0 6px; }
.cap p { font: 400 clamp(19px, 2.4vw, 26px)/1.35 var(--body); max-width: none; }
.check ol { font-size: 1.15rem; } .check h3 { font-size: 1.3rem; }
.wrap { max-width: max(560px, min(1500px, calc((100vh - 270px) * 1.5))); }
.nav button { font-size: 1.25rem; min-height: 58px; padding: 0 30px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #f4f5f2; --rule: #d9dee1; color-scheme: light; } :root:not([data-theme="light"]) .toolrow > span { color: #5b6774; } }
:root[data-theme="dark"] { --paper: #f4f5f2; --rule: #d9dee1; color-scheme: light; } :root[data-theme="dark"] .toolrow > span { color: #5b6774; }
.spin { position: absolute; inset: 0; background: #fff; touch-action: none; overflow: hidden; cursor: grab; }
.spin[hidden] { display: none; }
.spin img { position: absolute; left: 0; top: 0; width: 100%; height: calc(100% - 46px); object-fit: contain; transition: transform 0.25s ease; user-select: none; -webkit-user-select: none; pointer-events: none; }
.spinbar { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; font: 600 clamp(13px, 1.7vw, 17px)/1.2 var(--body); color: #1d2935; background: #f4f5f2; border-top: 1px solid #e3e6e8; }
#spinKey i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; background: #1e88ff; margin-right: 8px; vertical-align: -3px; }
#spinKey[hidden] { display: inline; visibility: hidden; }
.checkpic:empty { display: none; } .checkgrid:has(.checkpic:empty) { grid-template-columns: 1fr; }

.dot { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; background: #c0262d; vertical-align: -0.05em; margin-right: 0.3em; }
</style>

e fondant on and smooth it with your fingers.</li></ol>"],"brush":["Damp brush","M4 20l5-5 M9 15l8-8 3 3-8 8z","<ol><li>Wipe any icing out of the windows and the door.</li><li>Do it straight away, before it sets hard.</li></ol>"],"clock":["Wait","M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0 M12 7v5l3 3","<ol><li>Royal icing needs about an hour before you move it.</li><li>Use the time for the next small job.</li></ol>"],"lights":["Fairy lights","M3 6c4 4 14 4 18 0 M7 8v3 M12 9v3 M17 8v3 M7 13m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0 M12 14m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0 M17 13m-1.5 0a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0","<ol><li>Clip them along the inside, up high.</li><li>Leads out through the 3 slots at the bottom of the back wall.</li><li>Battery packs sit behind the house.</li><li>Test them, then switch off.</li></ol>"],"knife":["Serrated knife","M3 21l11-11 M14 10l6-6c1 2 0 5-3 7l-3-1z","<ol><li>Saw gently, don't press, to cut a biscuit at a slanted edge.</li><li>Also for trimming gingerbread that's too high.</li></ol>"],"cutters":["Cutters + white paste","M4 4h16v16H4z M8 8h8v8H8z","<ol><li>Roll white paste 3 mm thick. Dust with cornflour.</li><li>Press the cutter straight down. Peel the extra paste away.</li><li>Push the piece out. A dab of water on the back, then onto the gingerbread.</li></ol>"],"glue":["Quick-set wood glue","M9 3h6v3h2l1 4v11H6V10l1-4h2z M9 6h6","<svg class=\"pic\" viewBox=\"0 0 340 140\" role=\"img\" aria-label=\"A thin wiggly line of glue on the piece\">\n<rect x=\"30\" y=\"25\" width=\"280\" height=\"70\" fill=\"#e6c68c\" stroke=\"#1d2935\" stroke-width=\"1.5\"/>\n<path d=\"M48 60 q10 -14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0\" fill=\"none\" stroke=\"#1d2935\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n<path d=\"M48 60 q10 -14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0\" fill=\"none\" stroke=\"#fbf6e6\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<text x=\"30\" y=\"122\">thin wiggly line, 5 mm in from the edges</text>\n</svg><ol><li>Thin wiggly line on one piece, 5 mm in from the edges.</li><li>On an edge or an end: one thin line down the middle of it.</li><li>Push together, wipe off what squeezes out with a damp cloth.</li><li>Hold still 15 min. Full strength by tomorrow.</li></ol>"],"tape":["Masking tape","M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0-16 0 M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0 M20 12h3","<svg class=\"pic\" viewBox=\"0 0 340 140\" role=\"img\" aria-label=\"Tape pulled tight across the join\">\n<rect x=\"20\" y=\"25\" width=\"150\" height=\"75\" fill=\"#e6c68c\" stroke=\"#1d2935\" stroke-width=\"1.5\"/>\n<rect x=\"170\" y=\"25\" width=\"150\" height=\"75\" fill=\"#e6c68c\" stroke=\"#1d2935\" stroke-width=\"1.5\"/>\n<rect x=\"128\" y=\"32\" width=\"84\" height=\"14\" fill=\"#efe0a8\" stroke=\"#1d2935\"/>\n<rect x=\"128\" y=\"56\" width=\"84\" height=\"14\" fill=\"#efe0a8\" stroke=\"#1d2935\"/>\n<rect x=\"128\" y=\"80\" width=\"84\" height=\"14\" fill=\"#efe0a8\" stroke=\"#1d2935\"/>\n<path d=\"M100 63 H122 M114 57 L122 63 L114 69 M240 63 H218 M226 57 L218 63 L226 69\" fill=\"none\" stroke=\"#c0262d\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<text x=\"20\" y=\"125\">pull each piece tight across the join</text>\n</svg><ol><li>Pull a piece tight across the join every 10 to 15 cm.</li><li>Roof pieces: long strips from the roof down onto the walls.</li><li>Leave it on 1 hour, then peel it off.</li></ol>"],"weight":["Weight on top","M6 21h12l-2-11H8z M10 10V7a2 2 0 0 1 4 0v3","<svg class=\"pic\" viewBox=\"0 0 340 140\" role=\"img\" aria-label=\"Books stacked on the glued piece\">\n<rect x=\"40\" y=\"95\" width=\"260\" height=\"18\" fill=\"#e6c68c\" stroke=\"#1d2935\" stroke-width=\"1.5\"/>\n<path d=\"M60 95 H280\" stroke=\"#9aa3ab\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n<rect x=\"90\" y=\"63\" width=\"160\" height=\"32\" rx=\"3\" fill=\"#b4c5c1\" stroke=\"#1d2935\" stroke-width=\"1.5\"/>\n<rect x=\"105\" y=\"35\" width=\"130\" height=\"28\" rx=\"3\" fill=\"#c6ab7c\" stroke=\"#1d2935\" stroke-width=\"1.5\"/>\n<text x=\"40\" y=\"132\">books, flour bags or tins; baking paper under</text>\n</svg><ol><li>Anything heavy and flat: books, flour bags, a box of tins.</li><li>Baking paper under it so squeezed-out glue cannot stick.</li><li>15 min for the top rails, 30 min for the flat roof.</li></ol>"],"hands":["Two people","M7 11V6a1.5 1.5 0 0 1 3 0v5 M10 10V5a1.5 1.5 0 0 1 3 0v6 M13 11V7a1.5 1.5 0 0 1 3 0v6 M16 13l2-2a1.5 1.5 0 0 1 2 2l-4 6a5 5 0 0 1-9 0l-2-5a1.5 1.5 0 0 1 2.8-1l1.2 2","<ol><li>One person each end, fingers under the bottom edges.</li><li>Never lift by the gingerbread or the roof.</li><li>Keep it level.</li></ol>"]}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const P = D.pages, TOOLS = D.tools;
  const canvas = document.getElementById("view");
  if (!window.THREE) { document.getElementById("text").textContent = "The 3D pictures could not load. Try reopening the page."; return; }
  const hash = location.hash || "";
  const print = /print/.test(hash);
  if (print) document.body.classList.add("print");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const world = new THREE.Group(); scene.add(world);
  const camera = new THREE.PerspectiveCamera(28, 1.5, 10, 30000);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc4b4, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-700, 1500, 1200); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(900, 600, -1300); scene.add(fill);
  const COL = { ply9: 0xe6c68c, base: 0xd3b07c, base17: 0xd3b07c, timber: 0xa8713d, brass: 0xc9a54a, salvage: 0x8f5b3a, ginger: 0x8a5226, biscuit: 0xd9a45a, cream: 0xf7eed8 };
  const OLD = { ply9: 0xebe1cb, base: 0xe3d4b8, base17: 0xe3d4b8, timber: 0xd2b893, brass: 0xe3d3a3, salvage: 0xcdb49a, ginger: 0xa97447, biscuit: 0xe2c48e, cream: 0xf5eee0 };
  const meshes = D.parts.map(p => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(p.v, 3)); g.setIndex(p.f); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: COL[p.kind] || COL.ply9, roughness: 0.9, metalness: 0, flatShading: true, side: THREE.DoubleSide }));
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 20), new THREE.LineBasicMaterial({ color: 0x1d2935 }));
    m.add(edges); m.userData = { p, edges }; m.visible = false; world.add(m);
    g.computeBoundingBox(); m.userData.center = g.boundingBox.getCenter(new THREE.Vector3());
    return m;
  });
  const arrows = new THREE.Group(); world.add(arrows);
  // red screw dots: children of their piece, so they slide in with it; ax turns the disc to lie flat on a standing wall
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xc0262d });
  const dotGeo = new THREE.CylinderGeometry(16, 16, 1.2, 20);
  let dotMeshes = [];
  function clearDots() { dotMeshes.forEach(d => { if (d.parent) d.parent.remove(d); }); dotMeshes = []; }
  function addDots(pg) { (pg.dots || []).forEach(([k, x, y, z, ax]) => { const d = new THREE.Mesh(dotGeo, dotMat); d.position.set(x, y, z); if (ax === "x") d.rotation.z = Math.PI / 2; if (ax === "z") d.rotation.x = Math.PI / 2; meshes[k].add(d); dotMeshes.push(d); }); }
  const black = new THREE.MeshBasicMaterial({ color: 0x151515, depthTest: false, transparent: true, opacity: 0.95 });
  function arrow(from, to, s) {
    const dir = new THREE.Vector3().subVectors(to, from); const len = dir.length(); if (len < 4 * s) return; dir.normalize();
    const head = Math.min(8 * s, len * 0.45), shaftLen = len - head;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(s, s, shaftLen, 12), black);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(2.8 * s, head, 16), black);
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    shaft.quaternion.copy(q); cone.quaternion.copy(q);
    shaft.position.copy(from).addScaledVector(dir, shaftLen / 2); cone.position.copy(from).addScaledVector(dir, shaftLen + head / 2);
    shaft.renderOrder = cone.renderOrder = 20; arrows.add(shaft); arrows.add(cone);
  }
  // thumbnails for the parts box
  const tcan = document.createElement("canvas");
  const tr = new THREE.WebGLRenderer({ canvas: tcan, antialias: true, alpha: true, preserveDrawingBuffer: true }); tr.setPixelRatio(1); tr.setSize(200, 150);
  const tscene = new THREE.Scene(); tscene.add(new THREE.HemisphereLight(0xffffff, 0xcfc4b4, 1.0));
  const tsun = new THREE.DirectionalLight(0xffffff, 0.5); tsun.position.set(-1, 2, 1.5); tscene.add(tsun);
  const tcam = new THREE.PerspectiveCamera(25, 4 / 3, 1, 50000);
  const thumbCache = {};
  function thumb(i) {
    const key = D.parts[i].name; if (thumbCache[key]) return thumbCache[key];
    const src = meshes[i]; const m = new THREE.Mesh(src.geometry, new THREE.MeshStandardMaterial({ color: COL[D.parts[i].kind] || COL.ply9, roughness: 0.9, flatShading: true, side: THREE.DoubleSide }));
    m.add(new THREE.LineSegments(src.userData.edges.geometry, new THREE.LineBasicMaterial({ color: 0x1d2935 })));
    const c = src.userData.center; m.position.set(-c.x, -c.y, -c.z); tscene.add(m);
    src.geometry.computeBoundingSphere();
    const rad = src.geometry.boundingSphere.radius, d = rad / Math.sin(0.5 * 25 * Math.PI / 180) * 1.05;
    tcam.position.set(d * Math.cos(0.5) * Math.sin(-0.7), d * Math.sin(0.5), d * Math.cos(0.5) * Math.cos(-0.7)); tcam.lookAt(0, 0, 0);
    tr.render(tscene, tcam); const url = tcan.toDataURL("image/png"); tscene.remove(m);
    thumbCache[key] = url; return url;
  }
  function icon(code) { return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + TOOLS[code][1] + '"/></svg>'; }

  // ---- camera: the booklet angle for each page, tweened between pages
  let cam = { yaw: -0.5, pitch: 0.5, dist: 3000, tx: 0, ty: 0, tz: 0 }, flipNow = 0;
  function place() {
    camera.position.set(cam.tx + cam.dist * Math.cos(cam.pitch) * Math.sin(cam.yaw), cam.ty + cam.dist * Math.sin(cam.pitch), cam.tz + cam.dist * Math.cos(cam.pitch) * Math.cos(cam.yaw));
    camera.lookAt(cam.tx, cam.ty, cam.tz);
  }
  function size() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  function fitFor(yaw, pitch, panLeft) {
    const box = new THREE.Box3(); let any = false;
    meshes.forEach(m => { if (m.visible) { box.expandByObject(m); any = true; } });
    arrows.children.forEach(a => box.expandByObject(a));
    const c = { yaw, pitch, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz };
    if (!any) return c;
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    const vfov = camera.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
    c.dist = sphere.radius / Math.sin(Math.min(vfov, hfov) / 2) * 1.12;
    c.tx = sphere.center.x; c.ty = sphere.center.y; c.tz = sphere.center.z;
    if (panLeft) {   // overlays sit on the left: push the model right
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const span = 2 * c.dist * Math.tan(hfov / 2);
      c.tx -= right.x * span * panLeft; c.tz -= right.z * span * panLeft;
    }
    return c;
  }
  const lerp = (a, b, k) => a + (b - a) * k;
  function lerpCam(a, b, k) { return { yaw: lerp(a.yaw, b.yaw, k), pitch: lerp(a.pitch, b.pitch, k), dist: lerp(a.dist, b.dist, k), tx: lerp(a.tx, b.tx, k), ty: lerp(a.ty, b.ty, k), tz: lerp(a.tz, b.tz, k) }; }
  function render() { world.rotation.set(0, 0, flipNow); place(); renderer.render(scene, camera); }

  // ---- pages
  let cur = 0, moves = [], T = 0, flipGoal = 0, goal = cam;
  function applyT(t) {
    T = t;
    moves.forEach(mv => mv.meshes.forEach(m => m.position.copy(mv.vec).multiplyScalar(1 - t)));
    black.opacity = 0.95 * (1 - t); arrows.visible = t < 0.995;
    const sl = document.getElementById("scrub"); if (sl) sl.value = Math.round(t * 100);
  }
  // ---- turn-around pictures of the finished house (decorating steps): drag to turn, tap to zoom
  const SC = JSON.parse(document.getElementById("spincfg").textContent);
  const spinEl = document.getElementById("spin"), spinImg = document.getElementById("spinImg");
  let spinKey = null, spinIdx = SC.start, spinZoom = false, spinDrag = null;
  const spinSrc = (k, i) => SC.dir + k + "_" + String(i).padStart(2, "0") + ".jpg";
  function spinShow() { spinImg.src = spinSrc(spinKey, spinIdx); }
  function showSpin(key) {
    if (!key) { spinEl.hidden = true; canvas.style.visibility = ""; spinKey = null; return; }
    spinEl.hidden = false; canvas.style.visibility = "hidden";
    if (key !== spinKey) { spinKey = key; spinIdx = SC.start; }
    spinZoom = false; spinImg.style.transform = ""; spinShow();
    document.getElementById("spinKey").hidden = key === "none";
    for (let i = 0; i < SC.n; i++) { const im = new Image(); im.src = spinSrc(key, i); }
  }
  spinEl.addEventListener("pointerdown", e => { spinDrag = { x: e.clientX, i: spinIdx, moved: false }; try { spinEl.setPointerCapture(e.pointerId); } catch (err) {} });
  spinEl.addEventListener("pointermove", e => {
    if (!spinDrag) return;
    const dx = e.clientX - spinDrag.x;
    if (Math.abs(dx) > 8) spinDrag.moved = true;
    if (!spinDrag.moved) return;
    const step = Math.max(16, spinEl.clientWidth / (SC.n * 1.3));
    const i = Math.max(0, Math.min(SC.n - 1, spinDrag.i - Math.round(dx / step)));
    if (i !== spinIdx) { spinIdx = i; spinShow(); }
  });
  function spinUp(e) {
    if (spinDrag && !spinDrag.moved) {
      if (spinZoom) { spinImg.style.transform = ""; spinZoom = false; }
      else {
        const b = spinImg.getBoundingClientRect();
        const px = Math.max(0, Math.min(100, (e.clientX - b.left) / b.width * 100)), py = Math.max(0, Math.min(100, (e.clientY - b.top) / b.height * 100));
        spinImg.style.transformOrigin = px + "% " + py + "%"; spinImg.style.transform = "scale(2.4)"; spinZoom = true;
      }
    }
    spinDrag = null;
  }
  spinEl.addEventListener("pointerup", spinUp);
  spinEl.addEventListener("pointercancel", () => { spinDrag = null; });

  function setupPage(i) {
    cur = Math.max(0, Math.min(P.length - 1, i));
    const pg = P[cur];
    meshes.forEach(m => { m.visible = false; m.position.set(0, 0, 0); });
    arrows.clear(); moves = []; clearDots();
    flipGoal = pg.flip ? Math.PI : 0;
    const newParts = [], specs = [];
    document.querySelector(".sheet").classList.toggle("inv", cur === 0);
    if (cur === 0) {
      meshes.forEach((m, k) => { if (pg.show.includes(k)) { m.visible = true; m.material.color.setHex(COL[m.userData.p.kind] || COL.ply9); m.userData.edges.material.color.setHex(0x1d2935); } });
    } else {
      pg.show.forEach(k => { const m = meshes[k]; m.visible = true; m.material.color.setHex(OLD[m.userData.p.kind] || OLD.ply9); m.userData.edges.material.color.setHex(0x9c9488); });
      pg.moves.forEach(mv => {
        const v = new THREE.Vector3(...mv.vec);
        const to = new THREE.Box3(); const ms = [];
        mv.parts.forEach(k => { const m = meshes[k]; m.visible = true; m.position.copy(v); m.material.color.setHex(COL[m.userData.p.kind] || COL.ply9); m.userData.edges.material.color.setHex(0x1d2935); newParts.push(k); ms.push(m); to.expandByObject(m); });
        moves.push({ vec: v, meshes: ms });
        if (mv.arrow) {
          const tc = to.getCenter(new THREE.Vector3());     // exploded centre
          const fc = tc.clone().sub(v);                      // final centre
          const dir = v.clone().normalize(), span = v.length();
          const halfAlong = Math.abs(to.getSize(new THREE.Vector3()).dot(dir)) / 2;
          const a = tc.clone().addScaledVector(dir, -(halfAlong + 0.08 * span));
          specs.push([a, mv.alen ? a.clone().addScaledVector(dir, -mv.alen) : fc.clone().addScaledVector(dir, Math.min(halfAlong, span * 0.35))]);
        }
      });
      const box = new THREE.Box3(); meshes.forEach(m => { if (m.visible) box.expandByObject(m); });
      const r = box.getBoundingSphere(new THREE.Sphere()).radius;
      const s = Math.max(2.5, Math.min(9, r / 110));
      specs.forEach(([a, b]) => arrow(a, b, s));
      addDots(pg);
    }
    // overlays
    document.getElementById("num").textContent = cur === 0 ? "" : cur;
    document.getElementById("num").style.display = cur === 0 ? "none" : "grid";
    const badge = document.getElementById("badge"); badge.hidden = !pg.badge; badge.textContent = pg.badge || "";
    document.getElementById("title").textContent = pg.title; document.getElementById("text").textContent = pg.text;
    const ck = document.getElementById("check"); ck.hidden = !pg.check;
    if (pg.check) { document.getElementById("checkTitle").textContent = pg.check.title; document.getElementById("checkPic").innerHTML = pg.check.svg; document.getElementById("checkList").innerHTML = pg.check.items.map((t, i) => "<li><b>" + (i + 1) + "</b><span>" + t + "</span></li>").join(""); }
    const counts = {}; const order = [];
    (cur === 0 ? pg.show : newParts).forEach(k => { const n = D.parts[k].name; if (!counts[n]) { counts[n] = { n: 0, k }; order.push(n); } counts[n].n++; });
    const pb = document.getElementById("parts");
    const entries = pg.partsbox ? pg.partsbox.map(([label, n, k]) => [label, n, k]) : order.map(n => [n + (D.parts[counts[n].k].code && cur > 0 ? " (" + D.parts[counts[n].k].code + ")" : ""), counts[n].n, counts[n].k]);
    pb.innerHTML = entries.map(([label, n, k]) => '<div><img alt="" src="' + thumb(k) + '"><span><b>' + n + 'x</b><small>' + label + '</small></span></div>').join("");
    pb.style.display = entries.length ? "grid" : "none";
    document.getElementById("tools").innerHTML = pg.tools.map(t => '<button type="button" class="tl" data-t="' + t + '" aria-label="How to use: ' + TOOLS[t][0] + '">' + icon(t) + TOOLS[t][0] + '<i aria-hidden="true">?</i></button>').join("");
    const lg = document.getElementById("legend"); lg.hidden = cur !== 0;
    if (cur === 0) lg.innerHTML = '<h3>You will need</h3>' + Object.keys(TOOLS).filter(t => t !== "hands").map(t => '<button type="button" class="tl" data-t="' + t + '" aria-label="How to use: ' + TOOLS[t][0] + '">' + icon(t) + TOOLS[t][0] + '<i aria-hidden="true">?</i></button>').join("");
    showSpin(pg.spin);
    document.getElementById("back").disabled = cur === 0;
    const nx = document.getElementById("next"); nx.disabled = cur === P.length - 1; nx.textContent = cur === P.length - 1 ? "Done" : "Next";
    document.getElementById("where").textContent = cur === 0 ? "Parts and tools" : "Step " + cur + " of " + (P.length - 1);
    document.getElementById("watch").disabled = moves.length === 0;
    document.getElementById("scrub").disabled = moves.length === 0;
    size();
    applyT(0);
    goal = fitFor(pg.cam[0], pg.cam[1], canvas.clientWidth > 700 ? 0.13 : 0);
    try { localStorage.setItem("gt_barb_page", String(cur)); } catch (e) {}
  }

  // ---- tap a tool: how to use it, and where on this step
  const how = document.getElementById("how");
  let howFrom = null;
  function openHow(t) {
    const pg = P[cur], tool = TOOLS[t]; if (!tool) return;
    document.getElementById("howTitle").innerHTML = icon(t) + '<span>' + tool[0] + '</span>';
    const w = pg.where && pg.where[t];
    document.getElementById("howBody").innerHTML = (w ? '<h3>Where, this step</h3>' + w : '') + (tool[2] ? '<h3>How</h3>' + tool[2] : '');
    howFrom = document.activeElement; how.hidden = false; how.querySelector(".howcard").scrollTop = 0;
    document.getElementById("howClose").focus();
  }
  function closeHow() { if (how.hidden) return; how.hidden = true; if (howFrom && howFrom.focus) howFrom.focus(); }
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("button.tl");
    if (b) { stopAll(); openHow(b.dataset.t); return; }
    if (e.target === how || (e.target.closest && e.target.closest("#howClose"))) closeHow();
  });

  // ---- a tiny tween queue: camera moves, holds, and the pieces sliding home
  let queue = [], active = null, playingAll = false;
  const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  function tween(dur, fn, done) { queue.push({ dur: reduce ? 0 : dur, fn, done }); kick(); }
  function kick() { if (!active && queue.length) { active = queue.shift(); active.t0 = performance.now(); requestAnimationFrame(frame); } }
  function frame(now) {
    if (!active) return;
    const k = active.dur ? Math.min(1, (now - active.t0) / active.dur) : 1;
    active.fn(ease(k)); render();
    if (k >= 1) { const d = active.done; active = null; if (d) d(); kick(); } else requestAnimationFrame(frame);
  }
  function stopAll() { queue = []; active = null; playingAll = false; setPlayUI(); }
  function goTo(i, then, instant) {
    setupPage(i);
    const from = Object.assign({}, cam), g = goal, f0 = flipNow, f1 = flipGoal;
    tween(instant ? 0 : 900, k => { cam = lerpCam(from, g, k); flipNow = lerp(f0, f1, k); }, then);
  }
  function watchStep(then) {
    if (!moves.length) { if (then) then(); return; }
    tween(500, () => applyT(0));
    tween(2200, k => applyT(k), () => tween(600, () => applyT(1), then));
  }
  function setPlayUI() {
    const b = document.getElementById("watchall");
    b.textContent = playingAll ? "Pause" : "Watch it all";
    b.classList.toggle("on", playingAll);
    document.getElementById("where").textContent = playingAll ? "Playing step " + cur + " of " + (P.length - 1) : (cur === 0 ? "Parts and tools" : "Step " + cur + " of " + (P.length - 1));
  }
  function playFrom(i) {
    if (!playingAll) return;
    goTo(i, () => { setPlayUI(); watchStep(() => { if (!playingAll) return; if (cur < P.length - 1) playFrom(cur + 1); else { playingAll = false; setPlayUI(); } }); });
  }
  document.getElementById("next").addEventListener("click", () => { stopAll(); goTo(cur + 1); });
  document.getElementById("back").addEventListener("click", () => { stopAll(); goTo(cur - 1); });
  document.getElementById("watch").addEventListener("click", () => { stopAll(); watchStep(); });
  document.getElementById("watchall").addEventListener("click", () => {
    if (playingAll) { stopAll(); return; }
    playingAll = true; setPlayUI(); playFrom(cur === 0 ? 1 : cur);
  });
  document.getElementById("scrub").addEventListener("input", e => { stopAll(); applyT(+e.target.value / 100); render(); });
  window.addEventListener("keydown", e => {
    if (!how.hidden) { if (e.key === "Escape") closeHow(); return; }
    if (e.key === "ArrowRight") { stopAll(); goTo(cur + 1); }
    if (e.key === "ArrowLeft") { stopAll(); goTo(cur - 1); }
    if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); stopAll(); watchStep(); }
  });
  // drag to turn the picture (it goes back to the booklet angle on the next page)
  let drag = null;
  canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY }; if (active && !moves.length) stopAll(); });
  canvas.addEventListener("pointermove", e => { if (!drag) return; cam.yaw -= (e.clientX - drag.x) * 0.008; cam.pitch = Math.max(-1.2, Math.min(1.45, cam.pitch + (e.clientY - drag.y) * 0.006)); drag = { x: e.clientX, y: e.clientY }; if (!active) render(); });
  canvas.addEventListener("pointerup", () => drag = null); canvas.addEventListener("pointercancel", () => drag = null);
  window.addEventListener("resize", () => { const t = T; setupPage(cur); cam = goal; flipNow = flipGoal; applyT(t); render(); });
  let start = 0; try { start = +(localStorage.getItem("gt_barb_page") || 0); } catch (e) {}
  const hp = /p=(\d+)/.exec(hash); if (hp) start = +hp[1];
  goTo(start, null, true);
  if (/auto/.test(hash)) { playingAll = true; setPlayUI(); playFrom(start === 0 ? 1 : start); }
})();
</script>
